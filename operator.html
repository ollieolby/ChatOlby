<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#17221c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="strict-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Chat inbox</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="operator-body">
    <section id="loginView" class="login-card">
      <div class="avatar dark">O</div>
      <h1>Your inbox</h1>
      <p>Sign in with the private operator account configured in Supabase.</p>
      <form id="loginForm">
        <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required />
        <input id="operatorPasswordInput" type="password" autocomplete="current-password" minlength="12" placeholder="Password" required />
        <button class="primary-button" type="submit">Sign in</button>
        <button id="operatorForgotPasswordButton" class="text-button" type="button">Forgot password?</button>
      </form>
      <p id="loginNotice" class="notice"></p>
    </section>

    <main id="inboxView" class="inbox hidden">
      <aside class="conversation-list-panel">
        <header><h1>Inbox</h1><div class="header-actions"><button id="notificationButton" class="icon-button" aria-label="Enable notifications" title="Enable notifications">♢</button><button id="refreshButton" class="icon-button" aria-label="Refresh">↻</button></div></header>
        <div id="conversationList" class="conversation-list"></div>
      </aside>
      <section class="thread-panel">
        <header class="thread-header">
          <button id="backButton" class="back-button" aria-label="Back">←</button>
          <div><h2 id="threadTitle">Choose a chat</h2><p id="threadMeta"></p></div>
        </header>
        <div id="operatorMessages" class="messages"></div>
        <form id="replyForm" class="composer operator-composer hidden">
          <textarea id="replyInput" rows="1" maxlength="2000" placeholder="Reply as yourself…"></textarea>
          <button id="drawButton" class="draw-button" type="button" aria-label="Draw a reply">✎</button>
          <button class="send-button" type="submit" aria-label="Send reply"><svg viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8-3-8Zm3.7 7h8.4L6.4 6.5 7.7 11Zm-1.3 6.5 9.7-4.5H7.7l-1.3 4.5Z"/></svg></button>
        </form>
      </section>
    </main>

    <dialog id="drawingDialog" class="drawing-dialog">
      <div class="drawing-toolbar"><button id="clearDrawing" type="button">Clear</button><strong>Draw something terrible</strong><button id="closeDrawing" type="button">Cancel</button></div>
      <canvas id="drawingCanvas"></canvas>
      <button id="sendDrawing" class="primary-button" type="button">Send drawing</button>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="config.js"></script>
    <script type="module" src="operator.js"></script>
  </body>
</html>
